[project]
name = "cheshire-backend"
version = "0.1.0"
description = "The backend AI evaluation server for Cheshire."
authors = [
    { name = "Idontknow13", email = "curtmatthewgarcia@gmail.com" },
    { name = "sleeptical", email = "yumidocusin@gmail.com" },
    { name = "yohan-21", email = "ivan.maano21@gmail.com" },
    { name = "jjh0a", email = "seeswoon5@gmail.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling[easyocr,vlm] (>=2.75.0,<3.0.0)",
    "docling-haystack (>=0.1.1,<0.2.0)",
    "ollama-haystack (>=6.1.0,<7.0.0)",
    "haystack-ai (>=2.25.0,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "exa-haystack (>=1.0.2,<2.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "fastapi (>=0.135.0,<0.136.0)",
    "types-aiofiles (>=25.1.0.20251011,<26.0.0.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "num2words (>=0.5.14,<0.6.0)",
    "togetherai-haystack (>=3.0.0,<4.0.0)",
    "fastembed-haystack (>=2.1.0,<3.0.0)",
    "lancedb-haystack (>=0.1.1,<0.2.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "qdrant-client (>=1.17.1,<2.0.0)",
    "qdrant-haystack (>=10.3.0,<11.0.0)",
    "sse-starlette (>=3.4.4,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false


[tool.mypy]
mypy_path = "src"
warn_return_any = true
ignore_missing_imports = false

[tool.pyright]
venvPath = "."
pythonVersion = "3.12"
executionEnvironments = [{ root = "src" }]

[[tool.mypy.overrides]]
module = [
    "haystack_integrations.components.websearch.exa",
    "haystack_integrations.components.websearch.exa.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = ["pytest (>=9.0.2,<10.0.0)"]
