services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cheshire-qdrant
    restart: unless-stopped
    volumes:
      - ~/.cheshire/qdrant:/qdrant/storage
    networks:
      - cheshire

  cheshire-backend:
    build:
      context: ./cheshire-backend
      network: host
      dockerfile: Dockerfile
    container_name: cheshire-backend
    restart: unless-stopped
    environment:
      - CHESHIRE_DATA_PATH=/data
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    env_file:
      - path: ./cheshire-backend/.env
        required: true
      - path: ./cheshire-backend/.env.user
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ~/.cheshire:/data
    depends_on:
      - qdrant
    networks:
      - cheshire

  cheshire-frontend:
    build:
      context: ./cheshire-frontend
      dockerfile: Dockerfile
      target: development
    container_name: cheshire-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URI=http://cheshire-backend:8000
    depends_on:
      - cheshire-backend
    networks:
      - cheshire

networks:
  cheshire:
    driver: bridge
