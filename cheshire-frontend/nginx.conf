server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDFs can be up to 100 MB (see validate_pdf.ts); leave headroom for multipart overhead
    client_max_body_size 110m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/security-headers.conf;

    # API → backend container. Path is preserved (/api/v1/... stays /api/v1/...).
    location /api/ {
        proxy_pass http://cheshire-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat uses Server-Sent Events: never buffer, allow long-lived responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Backend health check (optional, handy for monitoring)
    location = /healthcheck {
        proxy_pass http://cheshire-backend:8000/healthcheck;
    }

    # pdf.js worker is an ES module (.mjs). Browsers refuse module scripts that
    # aren't served as a JavaScript MIME type, and nginx's default is octet-stream.
    location ~* \.mjs$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hashed build assets: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }

    location = /sitemap.xml {
        return 404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}